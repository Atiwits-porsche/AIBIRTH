<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0a1f">
<title>A Surprise For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #2a0a1f;
    --bg-2: #5b1136;
    --rose: #ff4d8d;
    --coral: #ff7a59;
    --blush: #ffd0de;
    --blush-strong: #ffe3ec;
    --paper: #fff8f3;
    --ink: #4a1030;
    --ink-accent: #c2185b;
    --glass: rgba(255, 255, 255, 0.07);
    --glass-line: rgba(255, 255, 255, 0.16);
    --script: "Dancing Script", "Brush Script MT", cursive;
    --sans: "Quicksand", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--sans);
    color: var(--blush);
    background: radial-gradient(120% 90% at 50% 0%, var(--bg-2), var(--bg-1) 70%) fixed;
    background-color: var(--bg-1);
    overflow-x: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  h1, h2 { font-family: var(--script); color: var(--blush-strong); margin: 0 0 8px; line-height: 1.15; }
  h1 { font-size: clamp(40px, 11vw, 60px); }
  h2 { font-size: clamp(32px, 9vw, 46px); }
  p { margin: 0 0 12px; font-size: 17px; line-height: 1.5; }

  /* floating background hearts */
  #bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  #bg span { position: absolute; bottom: -50px; animation: rise linear forwards; }
  @keyframes rise {
    0%   { transform: translateY(0) rotate(0deg); }
    50%  { transform: translateY(-55vh) translateX(18px) rotate(12deg); }
    100% { transform: translateY(-115vh) translateX(-10px) rotate(-8deg); }
  }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

  /* scenes */
  .scene {
    position: relative; z-index: 1;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .scene.active { display: flex; animation: fadeIn .6s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .btn {
    appearance: none; border: 0; cursor: pointer;
    min-height: 50px; padding: 14px 30px; border-radius: 999px;
    font: 700 18px var(--sans); color: #fff;
    background: linear-gradient(135deg, var(--rose), var(--coral));
    box-shadow: 0 10px 24px rgba(255, 77, 141, .35);
    transition: transform .2s ease, box-shadow .2s ease;
    touch-action: manipulation;
  }
  .btn:active { transform: scale(.96); }
  .btn.ghost { background: transparent; border: 2px solid var(--glass-line); box-shadow: none; color: var(--blush-strong); }
  .btn:focus-visible { outline: 3px solid var(--blush-strong); outline-offset: 3px; }

  /* intro */
  .envelope {
    position: relative; width: 220px; height: 140px; margin: 8px auto 30px;
    background: #ffd6e0; border-radius: 12px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .35);
    animation: bob 2.6s ease-in-out infinite;
  }
  .envelope::before, .envelope::after { content: ""; position: absolute; inset: 0; border-radius: 12px; }
  .envelope::after  { background: #ffb3c6; clip-path: polygon(0 100%, 50% 42%, 100% 100%); }
  .envelope::before { background: #ffc2d1; clip-path: polygon(0 0, 50% 58%, 100% 0); z-index: 1; }
  .seal { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%); font-size: 34px; z-index: 2; }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-2deg); } }

  /* game */
  #game { height: 100vh; height: 100dvh; justify-content: flex-start; gap: 12px; }
  .hud { width: 100%; max-width: 520px; }
  .hud h2 { font-size: clamp(28px, 8vw, 38px); }
  .hud p { font-size: 15px; margin-bottom: 8px; }
  .progress { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .bar { flex: 1; height: 12px; border-radius: 99px; background: var(--glass); border: 1px solid var(--glass-line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--rose), #ffb3c6); transition: width .25s ease; }
  .game-wrap {
    position: relative; flex: 1; min-height: 0; width: 100%; max-width: 520px;
    border-radius: 24px; background: var(--glass); border: 1px solid var(--glass-line); overflow: hidden;
  }
  .game-wrap.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #gameCanvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 20px; background: rgba(42, 10, 31, .6); backdrop-filter: blur(3px);
  }
  .overlay .big { font-size: 64px; line-height: 1; }

  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  /* ask */
  .ask-emoji { font-size: 84px; line-height: 1; margin: 10px 0 18px; }
  #yesBtn { transition: transform .3s cubic-bezier(.3, 1.6, .5, 1); }

  /* letter */
  .card {
    width: 100%; max-width: 540px; text-align: left;
    background: var(--paper); color: var(--ink);
    border-radius: 22px; padding: 30px 24px 26px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .4);
  }
  .card h2 { color: var(--ink-accent); }
  .card p { font-size: 18px; line-height: 1.65; }
  .typing::after { content: "|"; margin-left: 1px; animation: blink .8s steps(1) infinite; color: var(--ink-accent); }
  @keyframes blink { 50% { opacity: 0; } }
  .sign { font: 700 30px var(--script); color: var(--ink-accent); text-align: right; margin-top: 10px; }
  .gallery { display: flex; gap: 16px; overflow-x: auto; padding: 18px 6px 8px; scroll-snap-type: x mandatory; }
  .polaroid { flex: 0 0 auto; scroll-snap-align: center; background: #fff; padding: 8px 8px 26px; border-radius: 4px; box-shadow: 0 8px 20px rgba(74, 16, 48, .25); }
  .polaroid:nth-child(odd) { transform: rotate(-3deg); }
  .polaroid:nth-child(even) { transform: rotate(3deg); }
  .polaroid img { display: block; width: 150px; height: 150px; object-fit: cover; }
  .letter-actions { margin-top: 22px; }

  #musicBtn {
    position: fixed; z-index: 30; top: max(12px, env(safe-area-inset-top)); right: 12px;
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--glass-line);
    background: var(--glass); color: #fff; font-size: 20px; cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .envelope, .flame { animation: none; }
    .scene.active { animation: none; }
  }
</style>
</head>
<body>
<script>
  /* ============================================================
     ✏️  PERSONALISE HERE — just change the text between the quotes
     ============================================================ */
  const CONFIG = {
    toName: "My Love",          // who the surprise is for
    fromName: "Me",             // who it's from
    heartsToWin: 14,            // hearts to catch in the mini-game
    question: "Will you be my Valentine?",
    letter: [                   // the love letter — one line per paragraph
      "Happy Valentine's Day!",
      "Every day with you feels like a love story, and today I just want to remind you how much you mean to me.",
      "Thank you for your smile, your laugh, and for making ordinary moments magical.",
      "I can't wait for all the adventures still ahead of us.",
    ],
    photos: [],                 // e.g. ["photos/us1.jpg", "photos/us2.jpg"] — leave [] to hide
    music: "",                  // e.g. "music/our-song.mp3" — leave "" for no music
  };
</script>

<div id="bg" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<button id="musicBtn" hidden aria-label="Toggle music">🔊</button>

<main>
  <!-- 1. Intro -->
  <section class="scene active" id="intro">
    <div class="envelope" aria-hidden="true"><span class="seal">❤️</span></div>
    <h1>Hey <span data-to></span>,</h1>
    <p>Someone made you a little surprise…</p>
        <button class="btn" id="openBtn" style="margin-top:14px">Open it 💌</button>
  </section>

  <!-- 2. Mini-game -->
  <section class="scene" id="game">
    <div class="hud">
      <h2>Catch my heart</h2>
      <p>Collect 💖 · 💝 counts double · dodge 💔</p>
      <div class="progress">
        <div class="bar"><i id="barFill"></i></div>
        <span><span id="count">0</span>/<span id="goal"></span></span>
      </div>
    </div>
    <div class="game-wrap" id="gameWrap">
      <canvas id="gameCanvas" aria-label="Heart catching game"></canvas>
      <div class="overlay" id="gameStart">
        <div class="big">🧺</div>
        <p>Drag your finger to move the basket</p>
        <button class="btn" id="startBtn">Start</button>
      </div>
      <div class="overlay" id="gameWin" hidden>
        <div class="big">💘</div>
        <h2>You caught my heart!</h2>
        <button class="btn" id="toAsk">Next →</button>
      </div>
    </div>
  </section>

  <!-- 3. The question -->
  <section class="scene" id="ask">
    <div class="ask-emoji" id="askEmoji">🥺</div>
    <h2 id="question"></h2>
    <div class="row" style="margin-top:22px">
      <button class="btn" id="yesBtn">Yes 💖</button>
      <button class="btn ghost" id="noBtn">No</button>
    </div>
  </section>

  <!-- 4. Love letter -->
  <section class="scene" id="letter">
    <article class="card" id="letterCard">
      <h2>Dear <span data-to></span>,</h2>
      <div id="letterBody"></div>
      <div class="sign" id="sign" hidden>Love, <span data-from></span> 💕</div>
      <div class="gallery" id="gallery" hidden></div>
    </article>
    <div class="row letter-actions" id="letterActions" hidden>
      <button class="btn ghost" id="replayBtn">Replay ↺</button>
      <button class="btn" id="moreLove">More love 💖</button>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- fill in personal text ----------
  document.querySelectorAll("[data-to]").forEach((el) => (el.textContent = CONFIG.toName));
  document.querySelectorAll("[data-from]").forEach((el) => (el.textContent = CONFIG.fromName));
  $("#goal").textContent = CONFIG.heartsToWin;
  $("#question").textContent = CONFIG.question;
  document.title = "For " + CONFIG.toName + " 💖";

  // ---------- scenes ----------
  let current = "intro";
  const onEnter = { game: enterGame, letter: enterLetter };
  function show(id) {
    document.querySelectorAll(".scene").forEach((s) => s.classList.toggle("active", s.id === id));
    current = id;
    window.scrollTo(0, 0);
    if (onEnter[id]) onEnter[id]();
  }

  // ---------- floating background hearts ----------
  const bg = $("#bg");
  const bgIcons = ["💗", "💕", "💖", "🎈", "✨", "💘", "🌸"];
  function floatHeart() {
    if (document.hidden || bg.childElementCount > 18) return;
    const s = document.createElement("span");
    s.textContent = bgIcons[(Math.random() * bgIcons.length) | 0];
    s.style.left = rand(0, 96) + "%";
    s.style.fontSize = rand(14, 32) + "px";
    s.style.opacity = rand(0.35, 0.8);
    s.style.animationDuration = rand(8, 14) + "s";
    s.addEventListener("animationend", () => s.remove());
    bg.appendChild(s);
  }
  if (!reduceMotion) setInterval(floatHeart, 800);

  // ---------- confetti ----------
  const fx = $("#fx"), fctx = fx.getContext("2d");
  const COLORS = ["#ff4d8d", "#ff8fb1", "#ffd166", "#ffffff", "#c77dff", "#ff5e5b"];
  let parts = [], fxRunning = false;
  function sizeFx() {
    const d = window.devicePixelRatio || 1;
    fx.width = innerWidth * d; fx.height = innerHeight * d;
    fctx.setTransform(d, 0, 0, d, 0, 0);
  }
  function heartPath(ctx, s) {
    ctx.beginPath();
    ctx.moveTo(0, s * 0.35);
    ctx.bezierCurveTo(-s * 0.9, -s * 0.3, -s * 0.4, -s * 0.95, 0, -s * 0.4);
    ctx.bezierCurveTo(s * 0.4, -s * 0.95, s * 0.9, -s * 0.3, 0, s * 0.35);
    ctx.closePath();
  }
  function particle(x, y, vx, vy, g, life) {
    return { x, y, vx, vy, g, life, rot: rand(0, 6.28), vr: rand(-0.2, 0.2), size: rand(7, 13),
             color: COLORS[(Math.random() * COLORS.length) | 0], heart: Math.random() < 0.55 };
  }
  function burst(n = 140, x = innerWidth / 2, y = innerHeight / 2) {
    if (reduceMotion) n = Math.min(n, 30);
    for (let i = 0; i < n; i++) parts.push(particle(x, y, rand(-8, 8), rand(-13, -3), 0.28, rand(90, 160)));
    runFx();
  }
  function rain(n = 80) {
    if (reduceMotion) n = Math.min(n, 20);
    for (let i = 0; i < n; i++)
      parts.push(particle(rand(0, innerWidth), rand(-innerHeight * 0.6, -10), rand(-1, 1), rand(1.5, 3.5), 0.02, 500));
    runFx();
  }
  function runFx() { if (!fxRunning) { fxRunning = true; requestAnimationFrame(stepFx); } }
  function stepFx() {
    fctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter((p) => p.life > 0 && p.y < innerHeight + 40);
    for (const p of parts) {
      p.vy += p.g; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
      fctx.save();
      fctx.globalAlpha = Math.min(1, p.life / 30);
      fctx.translate(p.x, p.y); fctx.rotate(p.rot);
      fctx.fillStyle = p.color;
      if (p.heart) { heartPath(fctx, p.size); fctx.fill(); }
      else fctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      fctx.restore();
    }
    if (parts.length) requestAnimationFrame(stepFx);
    else { fxRunning = false; fctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  // ---------- music ----------
  let music = null;
  if (CONFIG.music) {
    music = new Audio(CONFIG.music);
    music.loop = true;
    $("#musicBtn").hidden = false;
    $("#musicBtn").addEventListener("click", () => {
      if (music.paused) { music.play().catch(() => {}); $("#musicBtn").textContent = "🔊"; }
      else { music.pause(); $("#musicBtn").textContent = "🔇"; }
    });
  }

  // ---------- 1. intro ----------
  $("#openBtn").addEventListener("click", () => {
    if (music) music.play().catch(() => {});
    burst(60, innerWidth / 2, innerHeight * 0.35);
    show("game");
  });

  // ---------- 2. mini-game ----------
  const canvas = $("#gameCanvas"), gctx = canvas.getContext("2d"), wrap = $("#gameWrap");
  const G = { w: 0, h: 0, basketX: 0, items: [], pops: [], score: 0, running: false, last: 0, spawnIn: 0 };
  const ITEMS = { good: { icon: "💖", pts: 1 }, bonus: { icon: "💝", pts: 2 }, bad: { icon: "💔", pts: -1 } };

  function sizeGame() {
    const r = wrap.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    if (!r.width) return;
    canvas.width = r.width * d; canvas.height = r.height * d;
    gctx.setTransform(d, 0, 0, d, 0, 0);
    G.w = r.width; G.h = r.height;
    G.basketX = G.basketX ? clamp(G.basketX, 32, G.w - 32) : G.w / 2;
  }
  function enterGame() { sizeGame(); drawGame(); }
  function moveBasket(e) {
    const r = canvas.getBoundingClientRect();
    G.basketX = clamp(e.clientX - r.left, 32, G.w - 32);
    if (!G.running) drawGame();
  }
  canvas.addEventListener("pointerdown", moveBasket);
  canvas.addEventListener("pointermove", moveBasket);
  addEventListener("keydown", (e) => {
    if (current !== "game") return;
    if (e.key === "ArrowLeft") G.basketX = clamp(G.basketX - 36, 32, G.w - 32);
    if (e.key === "ArrowRight") G.basketX = clamp(G.basketX + 36, 32, G.w - 32);
  });

  $("#startBtn").addEventListener("click", () => {
    $("#gameStart").hidden = true;
    G.running = true; G.last = performance.now(); G.spawnIn = 300;
    requestAnimationFrame(loop);
  });
  $("#toAsk").addEventListener("click", () => show("ask"));

  function spawn() {
    const r = Math.random();
    const type = r < 0.18 ? "bad" : r < 0.27 ? "bonus" : "good";
    G.items.push({ x: rand(22, G.w - 22), y: -30, vy: rand(2.2, 3.3) + G.score * 0.07, type });
  }
  function loop(t) {
    if (!G.running) return;
    const dt = Math.min(50, t - G.last) / 16.67;
    G.last = t;
    G.spawnIn -= dt * 16.67;
    if (G.spawnIn <= 0) { spawn(); G.spawnIn = Math.max(320, rand(480, 820) - G.score * 14); }

    const basketY = G.h - 46;
    G.items = G.items.filter((it) => {
      it.y += it.vy * dt;
      if (it.y > basketY - 28 && it.y < basketY + 14 && Math.abs(it.x - G.basketX) < 44) {
        catchItem(it); return false;
      }
      return it.y < G.h + 40;
    });
    G.pops = G.pops.filter((p) => (p.y -= 1.2 * dt, (p.life -= dt) > 0));
    drawGame();
    if (G.score >= CONFIG.heartsToWin) return win();
    requestAnimationFrame(loop);
  }
  function catchItem(it) {
    const def = ITEMS[it.type];
    G.score = Math.max(0, G.score + def.pts);
    G.pops.push({ x: it.x, y: it.y - 20, life: 40, text: (def.pts > 0 ? "+" : "") + def.pts, bad: def.pts < 0 });
    if (def.pts < 0) {
      buzz(90);
      wrap.classList.remove("shake"); void wrap.offsetWidth; wrap.classList.add("shake");
    } else buzz(15);
    $("#count").textContent = Math.min(G.score, CONFIG.heartsToWin);
    $("#barFill").style.width = Math.min(100, (G.score / CONFIG.heartsToWin) * 100) + "%";
  }
  function drawGame() {
    gctx.clearRect(0, 0, G.w, G.h);
    gctx.textAlign = "center"; gctx.textBaseline = "middle";
    gctx.font = "34px serif";
    for (const it of G.items) gctx.fillText(ITEMS[it.type].icon, it.x, it.y);
    gctx.font = "54px serif";
    gctx.fillText("🧺", G.basketX, G.h - 40);
    gctx.font = "700 22px Quicksand, sans-serif";
    for (const p of G.pops) {
      gctx.globalAlpha = Math.max(0, p.life / 40);
      gctx.fillStyle = p.bad ? "#ff8a8a" : "#ffe3ec";
      gctx.fillText(p.text, p.x, p.y);
    }
    gctx.globalAlpha = 1;
  }
  function win() {
    G.running = false; G.items = []; drawGame();
    const r = wrap.getBoundingClientRect();
    burst(170, r.left + r.width / 2, r.top + r.height / 2);
    buzz([40, 60, 40]);
    $("#gameWin").hidden = false;
  }

  // ---------- 3. the question ----------
  // "No" does nothing — except make "Yes" a little harder to resist 😄
  let noCount = 0;
  const noBtn = $("#noBtn");
  noBtn.addEventListener("click", () => {
    noCount++;
    $("#yesBtn").style.transform = "scale(" + Math.min(1 + noCount * 0.2, 2.6) + ")";
    buzz(20);
  });
  $("#yesBtn").addEventListener("click", () => {
    noBtn.hidden = true;
    $("#askEmoji").textContent = "😍";
    burst(260, innerWidth / 2, innerHeight / 2);
    buzz([30, 50, 30, 50, 80]);
    setTimeout(() => show("letter"), 1100);
  });

  // ---------- 4. love letter ----------
  let letterStarted = false, letterDone = false, skipTyping = reduceMotion;
  const body = $("#letterBody");
  $("#letterCard").addEventListener("click", () => { skipTyping = true; });
  function enterLetter() {
    if (letterStarted) return;
    letterStarted = true;
    rain(110);
    let pi = 0, ci = 0, p = null;
    const step = () => {
      if (skipTyping) {
        body.textContent = "";
        CONFIG.letter.forEach((txt) => { const el = document.createElement("p"); el.textContent = txt; body.appendChild(el); });
        return finishLetter();
      }
      if (pi >= CONFIG.letter.length) return finishLetter();
      if (!p) { p = document.createElement("p"); p.className = "typing"; body.appendChild(p); }
      const txt = CONFIG.letter[pi];
      p.textContent = txt.slice(0, ++ci);
      if (ci >= txt.length) { p.className = ""; p = null; pi++; ci = 0; setTimeout(step, 380); }
      else setTimeout(step, 34);
    };
    setTimeout(step, 500);
  }
  function finishLetter() {
    if (letterDone) return;
    letterDone = true;
    $("#sign").hidden = false;
    if (CONFIG.photos.length) {
      const gal = $("#gallery");
      CONFIG.photos.forEach((src) => {
        const fig = document.createElement("div");
        fig.className = "polaroid";
        const img = document.createElement("img");
        img.src = src; img.alt = "Our photo"; img.loading = "lazy";
        fig.appendChild(img); gal.appendChild(fig);
      });
      gal.hidden = false;
    }
    $("#letterActions").hidden = false;
  }
  $("#moreLove").addEventListener("click", (e) => { burst(120, e.clientX, e.clientY); rain(40); buzz(25); });
  $("#replayBtn").addEventListener("click", () => location.reload());

  // ---------- resize ----------
  sizeFx();
  addEventListener("resize", () => {
    sizeFx();
    if (current === "game") { sizeGame(); drawGame(); }
  });
})();
</script>
</body>
</html>
